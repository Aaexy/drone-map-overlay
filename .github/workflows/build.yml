name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.17.6"
      - run: ruff check src tests packaging
      - run: ruff format --check src tests packaging

  build:
    name: ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: DroneMapOverlay-Windows
          - name: macOS
            os: macos-latest
            artifact: DroneMapOverlay-macOS
          - name: Linux
            os: ubuntu-22.04
            artifact: DroneMapOverlay-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Linux system libraries for Qt (and ffmpeg for the rotation tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 fonts-dejavu-core ffmpeg

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -ra

      - name: Build app
        run: pyinstaller --noconfirm --log-level WARN packaging/dronemap.spec

      - name: Smoke test the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_sample.py smoke
          case "$RUNNER_OS" in
            macOS)   BIN="dist/Drone Map Overlay.app/Contents/MacOS/Drone Map Overlay" ;;
            Windows) BIN="dist/Drone Map Overlay/Drone Map Overlay.exe" ;;
            *)       BIN="dist/Drone Map Overlay/Drone Map Overlay" ;;
          esac
          "$BIN" --cli smoke/sample.mp4 --settings smoke/settings.json -o smoke/out.mp4
          test -s smoke/out.mp4
          python -c "import av; c = av.open('smoke/out.mp4'); v = c.streams.video[0]; n = sum(1 for _ in c.decode(v)); print('frames', n); assert n == 60"

      - name: Version
        run: echo "VERSION=$(python -c 'import sys; sys.path.insert(0, "src"); import dronemap; print(dronemap.__version__)')" >> "$GITHUB_ENV"

      # ---------------- Windows: installer + portable zip
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\Drone Map Overlay" "/DOutputDir=$PWD\out" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # portable: the same folder plus portable.txt, so settings stay next to the app
          Copy-Item -Recurse "dist\Drone Map Overlay" "portable\Drone Map Overlay"
          Set-Content "portable\Drone Map Overlay\portable.txt" "Settings, map cache and logs are kept in the data folder next to this file."
          Compress-Archive -Path "portable\Drone Map Overlay" -DestinationPath "out\DroneMapOverlay-$env:VERSION-Windows-Portable.zip"
          Get-ChildItem out

      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          function Run-Timed($file, $argList, $label, $limit = 240) {
            $p = Start-Process $file -ArgumentList $argList -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\$label.out" -RedirectStandardError "$env:RUNNER_TEMP\$label.err"
            if (-not $p.WaitForExit($limit * 1000)) {
              Write-Host "::error::$label did not finish within $limit s"
              Get-Process | Where-Object { $_.ProcessName -match 'Drone|unins|Setup|is-' } | Format-Table Id, ProcessName, MainWindowTitle
              $p.Kill($true); return $false
            }
            Write-Host "$label exit code $($p.ExitCode)"
            Get-Content "$env:RUNNER_TEMP\$label.out", "$env:RUNNER_TEMP\$label.err" -ErrorAction SilentlyContinue
            return ($p.ExitCode -eq 0)
          }
          $setup = (Get-ChildItem out\*-Setup.exe | Select-Object -First 1).FullName
          $dir = "$env:RUNNER_TEMP\dmo"
          $ok = Run-Timed $setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=`"$env:RUNNER_TEMP\setup.log`"", "/DIR=`"$dir`"") "install"
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40 -ErrorAction SilentlyContinue; exit 1 }
          Get-ChildItem $dir | Select-Object -First 5 | Format-Table Name
          $ok = Run-Timed "$dir\Drone Map Overlay.exe" @("--cli", "-v", "`"$PWD\smoke\sample.mp4`"", "--settings", "`"$PWD\smoke\settings.json`"", "-o", "`"$PWD\smoke\installed.mp4`"") "render"
          Get-Content "$env:LOCALAPPDATA\DroneMapOverlay\logs\dronemap.log" -Tail 30 -ErrorAction SilentlyContinue
          if (-not $ok -or -not (Test-Path smoke\installed.mp4)) { exit 1 }
          $ok = Run-Timed "$dir\unins000.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") "uninstall"
          Write-Host "installed, rendered and uninstalled OK"

      # ---------------- macOS: disk image + zip
      - name: macOS disk image
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          mkdir -p out
          packaging/macos/make_dmg.sh "dist/Drone Map Overlay.app" "out/DroneMapOverlay-$VERSION-macOS.dmg"
          ditto -c -k --keepParent "dist/Drone Map Overlay.app" "out/DroneMapOverlay-$VERSION-macOS.zip"
          MNT=$(hdiutil attach -nobrowse -readonly "out/DroneMapOverlay-$VERSION-macOS.dmg" | tail -1 | awk -F'\t' '{print $NF}')
          "$MNT/Drone Map Overlay.app/Contents/MacOS/Drone Map Overlay" --cli smoke/sample.mp4 --settings smoke/settings.json -o smoke/dmg.mp4
          hdiutil detach "$MNT"
          test -s smoke/dmg.mp4
          ls -la out

      # ---------------- Linux: AppImage + .deb + portable tar.gz
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL=./appimagetool packaging/linux/make_appimage.sh "dist/Drone Map Overlay" "out/DroneMapOverlay-$VERSION-Linux-x86_64.AppImage"
          packaging/linux/make_deb.sh "dist/Drone Map Overlay" "$VERSION" "out/drone-map-overlay_${VERSION}_amd64.deb"
          mkdir -p portable && cp -R "dist/Drone Map Overlay" portable/
          echo "Settings, map cache and logs are kept in the data folder next to this file." > "portable/Drone Map Overlay/portable.txt"
          tar -C portable -czf "out/DroneMapOverlay-$VERSION-Linux-Portable.tar.gz" "Drone Map Overlay"
          ls -la out

      - name: Linux packages smoke test
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          showlog() { tail -30 ~/.local/state/DroneMapOverlay/dronemap.log 2>/dev/null || true; }
          trap showlog EXIT
          timeout 240 "out/DroneMapOverlay-$VERSION-Linux-x86_64.AppImage" --cli -v smoke/sample.mp4 --settings smoke/settings.json -o smoke/appimage.mp4
          test -s smoke/appimage.mp4
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "./out/drone-map-overlay_${VERSION}_amd64.deb"
          ls -la /usr/bin/drone-map-overlay /opt/drone-map-overlay | head
          # call the installed command explicitly: pip's dev install also provides one on PATH
          timeout 240 /usr/bin/drone-map-overlay --cli -v smoke/sample.mp4 --settings smoke/settings.json -o smoke/deb.mp4 </dev/null
          test -s smoke/deb.mp4
          sudo apt-get remove -y drone-map-overlay

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
