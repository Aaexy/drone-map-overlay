name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: DroneMapOverlay-Windows
          - name: macOS
            os: macos-latest
            artifact: DroneMapOverlay-macOS
          - name: Linux
            os: ubuntu-22.04
            artifact: DroneMapOverlay-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 fonts-dejavu-core

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller --noconfirm --log-level WARN packaging/dronemap.spec

      - name: Smoke test the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_sample.py smoke
          case "$RUNNER_OS" in
            macOS)   BIN="dist/Drone Map Overlay.app/Contents/MacOS/Drone Map Overlay" ;;
            Windows) BIN="dist/Drone Map Overlay/Drone Map Overlay.exe" ;;
            *)       BIN="dist/Drone Map Overlay/Drone Map Overlay" ;;
          esac
          "$BIN" --cli smoke/sample.mp4 --settings smoke/settings.json -o smoke/out.mp4
          test -s smoke/out.mp4
          python -c "import av; c = av.open('smoke/out.mp4'); v = c.streams.video[0]; n = sum(1 for _ in c.decode(v)); print('frames', n); assert n == 60"

      - name: Package
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent "dist/Drone Map Overlay.app" "out/${{ matrix.artifact }}.zip" ;;
            Windows) (cd dist && 7z a -tzip "../out/${{ matrix.artifact }}.zip" "Drone Map Overlay" > /dev/null) ;;
            *)       tar -C dist -czf "out/${{ matrix.artifact }}.tar.gz" "Drone Map Overlay" ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
