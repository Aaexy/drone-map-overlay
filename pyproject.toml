[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-map-overlay"
dynamic = ["version"]
description = "Burn a live GPS map and flight stats into drone videos (DJI telemetry or .SRT)."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.9"
dependencies = [
    "av>=14",
    "certifi",
    "Pillow>=10.1",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6.5", "ruff==0.17.6"]

[project.scripts]
dronemap = "dronemap.cli:main"

[project.gui-scripts]
drone-map-overlay = "dronemap.app:main"

[tool.setuptools.dynamic]
version = {attr = "dronemap.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dronemap = ["assets/*.png", "assets/presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py39"
extend-exclude = ["packaging/dronemap.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # small lambdas are clearer than defs in a few places
    "UP007",   # Optional[...] is needed while we support Python 3.9
    "UP045",
    "SIM108",
    "RUF001", "RUF002", "RUF003",  # unicode punctuation in UI text is intentional
    "RUF012",
    "UP031",   # %-formatting is used deliberately for compact UI strings
    "RUF005",
    "SIM105",
    "RUF046",
]
